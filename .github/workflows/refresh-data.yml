name: Refresh data

on:
  schedule:
    # Tuesdays 09:00 UTC (05:00 New York): after the weekend and Monday night games
    - cron: "0 9 * * 2"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Fetch and check data
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_data.py --out data/players.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh data"
            git push
          fi

      # Anything that failed kept last week's data. Mark the run as failed so GitHub emails you.
      - name: Report problems
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Some data failed to refresh. See the 'Fetch and check data' step."
          exit 1
